services:
  # ---------------------------------------------------------------------------
  # local-stack profile: 仅当显式 `--profile local-stack` 才启动。
  # 默认部署复用宿主机上已有的 llm-pg / llm-redis（见 hero-quant.environment，
  # 直连宿主 tailscale IP 100.114.54.26，不依赖 docker 网络），
  # 因此这里不再默认拉起第二套 PG/Redis；镜像 tag 固定为本地已缓存的 16-alpine，
  # 避免 compose 因 postgres:16 触发拉取。
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["local-stack"]
    environment:
      POSTGRES_USER: heroquant
      POSTGRES_PASSWORD: heroquant
      POSTGRES_DB: heroquant
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL 入口：migrations/ 冻结区只读复制品，由 postgres 官方 entrypoint
      # 在数据目录为空时按文件名顺序执行；随本服务同属 local-stack profile，
      # 默认部署不会挂载。
      - ./scripts/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heroquant -d heroquant"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["local-stack"]
    # 淘汰策略 volatile-lru：仅带 TTL 的 key 可被淘汰。
    # hero:ticket:*（security.issue_ticket SET NX EX）、hero:lock:*（RedisLock SET NX EX）
    # 均带显式 EX，自然过期且淘汰方向为 fail-closed；hero:cache:* 可任意淘汰（可重算）。
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.26.2
    # temporal 的后端就是 local-stack 里的 postgres：postgres 被 profile 收走
    # 后 temporal 若留在默认集合会因 "depends on undefined service" 直接让
    # compose 解析失败，故一并收进 local-stack。
    profiles: ["local-stack"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: heroquant
      POSTGRES_PWD: heroquant
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
    restart: unless-stopped

  hero-quant:
    build: .
    # postgres/redis 被 local-stack profile 托管：默认模式下它们不存在于本
    # project 的启动集合里。required: false 让 compose 在依赖未启用时跳过等待，
    # 而不是报 "dependency not enabled"（compose spec 2.20+）。
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      temporal:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:8899:8899"
    # .env 缺失不得阻断 compose 解析（仓库不提交 .env）：required: false 表示
    # "有就读，没有就用下面的 environment 默认值"。
    env_file:
      - path: .env
        required: false
    environment:
      # 默认部署复用宿主机上既有的 llm-pg / llm-redis，两者由别的 project 创建，
      # 不接入任何 docker 网络（外部网络 heroquant-shared 已废弃，见文件末尾
      # networks 段），统一走宿主 tailscale IP 100.114.54.26 直连。
      #
      # 主机名口径（宿主与容器统一，2026-10-28 决策 D-1）：
      #   - 容器内（docker compose up）：100.114.54.26
      #   - 宿主机直跑（uvicorn hero_quant.api.server:app --port 8899）：100.114.54.26
      #     两者同一个地址，不再有"容器内不可达"的分叉；容器经默认 bridge NAT
      #     出网可达该 IP（已实测 5432/6379 通）。
      #   - 100.114.54.26 是本机的 tailscale IP：换机器或 IP 变了，改这里 +
      #     .env 的 HERO_*_DSN / HERO_REDIS_DSN 即可。
      #   - 127.0.0.1:5432/6379 不通：llm-pg / llm-redis 只绑 tailscale IP。
      #
      # 口令不进仓库：由 .env 提供 HERO_PG_PASSWORD。库名 heroquant 与
      # scripts/init/001_schema.sql 建库目标一致。
      #
      # local-stack profile（--profile local-stack 起本地 postgres/redis）场景：
      # 下方 environment 优先级高于 env_file，无法按 profile 条件覆盖，必须用 .env
      # 显式把这五个键改成容器内主机名 postgres / redis，例如
      #   HERO_PG_HOST=postgres
      #   HERO_CHECKPOINT_DSN=postgresql://heroquant:heroquant@postgres:5432/heroquant
      #   HERO_BILLING_DSN=postgresql://heroquant:heroquant@postgres:5432/heroquant
      #   HERO_VECTOR_DSN=postgresql://heroquant:heroquant@postgres:5432/heroquant
      #   HERO_REDIS_DSN=redis://redis:6379/0
      # 这里只写注释，不做双份配置。
      HERO_PG_HOST: 100.114.54.26
      HERO_CHECKPOINT_DSN: postgresql://${HERO_PG_USER:-llm}:${HERO_PG_PASSWORD:-}@100.114.54.26:5432/heroquant
      HERO_BILLING_DSN: postgresql://${HERO_PG_USER:-llm}:${HERO_PG_PASSWORD:-}@100.114.54.26:5432/heroquant
      HERO_VECTOR_DSN: postgresql://${HERO_PG_USER:-llm}:${HERO_PG_PASSWORD:-}@100.114.54.26:5432/heroquant
      HERO_REDIS_DSN: redis://100.114.54.26:6379/0
      # 可选降级开关（经 .env/env_file 透传，不写即默认 false；网关见 settings.py
      # ready_cohere_fatal / billing_allow_memory）：
      #   HERO_READY_COHERE_FATAL=true → 缺 COHERE_API_KEY 时 /ready 判 degraded（默认只 warning）
      #   HERO_BILLING_ALLOW_MEMORY=1  → 允许无 PG 内存计费，响应带 degraded:true
      # 两者默认 false 均为 fail-open 于可用性、fail-closed 于谎报：不配 DSN 仍显式失败。
      HERO_OTEL_MODE: shared
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
    networks:
      # 只留 default：otel-collector 在同 project 内按服务名解析；PG/Redis 走
      # 宿主 tailscale IP 直连，不需要额外的外部网络。
      - default
    volumes:
      - hero-runs:/app/agent/runs
      - hero-sessions:/app/agent/sessions
      # User-level state: persistent memory, sessions, skills, config.
      # Without this volume a rebuild/recreate wipes it.
      - hero-home:/home/vibe/.hero-quant
    # --- Runtime hardening ---
    cap_drop:
      - ALL
    # SETUID/SETGID are kept on purpose: sandbox runner drops privilege to the
    # unprivileged vibe-sandbox user (uid 10001) for LLM-generated-code subprocesses.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    # Writable scratch on the read-only rootfs. Named volumes above already
    # cover agent/runs, agent/sessions and /home/vibe/.hero-quant; these tmpfs
    # mounts cover /tmp and the cache dirs matplotlib/fontconfig write to.
    tmpfs:
      - /tmp
      - /home/vibe/.cache
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

volumes:
  pgdata:
  hero-runs:
  hero-sessions:
  hero-home:

networks:
  # 本 project 自带网络（otel-collector 及 local-stack profile 的 postgres/redis
  # 都在这里按服务名互相解析）。PG/Redis 不在任何 docker 网络里，走宿主
  # tailscale IP 100.114.54.26 直连。
  #
  # 已移除（2026-10-28 决策 D-1）：外部网络 heroquant-shared。它要求新克隆先跑
  # scripts/init/setup-shared-network.sh，否则 compose 直接 network not found，
  # 违反 AGENTS §3「docker compose up --build 应可一条命令起来」。该脚本保留但
  # deprecated（见其文件头），README 不再引用。
  default:
