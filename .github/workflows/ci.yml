name: CI

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:

jobs:
  hash-lock:
    timeout-minutes: 15
    name: hash-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Hash-lock check (blocking)
        run: |
          # requirements-lock.txt generated via: uv pip compile --generate-hashes pyproject.toml -o requirements-lock.txt
          # Blocking gate since W1-D: hash mismatch or missing lock file fails the job.
          pip install --dry-run --require-hashes -r requirements-lock.txt

  lint:
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check src
        # Uses pyproject.toml [tool.ruff] target-version py311, line-length 120, select E,F,W ignore E501
        run: ruff check src

  frontend:
    timeout-minutes: 15
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Typecheck (tsc --noEmit blocking)
        run: npm run typecheck --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Frontend unit tests
        run: npm run test:run --prefix frontend

  test:
    timeout-minutes: 15
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies (hash-gated, blocking)
        run: |
          # requirements-lock.txt 仅覆盖 core 依赖（uv pip compile pyproject.toml --generate-hashes）；hash 校验为阻塞门，失败即阻断（不使用 || fallback）
          # pip-audit/ruff/pytest-cov 阻塞门见 test.yml；此处 test job 亦强制 hash 安装
          pip install --require-hashes -r requirements-lock.txt
          pip install -e ".[dev]"
      - name: Run tests
        # pyproject.toml [tool.pytest.ini_options] testpaths = ["tests"] pythonpath = ["src"]
        # Coverage gate: 2026-08-22 实测 49% (10661 stmts, 5392 missed, 207 passed)；阈值 46 保留 ~3% headroom 且不致 CI 红
        run: |
          pytest -q --cov=src --cov-report=term --cov-fail-under=46
