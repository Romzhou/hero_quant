name: test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hero_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERO_CHECKPOINT_DSN: postgresql://postgres:postgres@localhost:5432/hero_quant
      # 中文：PG 相关 env 一次配齐（b9）。HERO_PG_DSN 与 checkpoint 同源，避免 conftest 守卫
      # 与用例落到不同键；PGPASSWORD 是 libpq 兜底口令——DSN 万一缺 userinfo 也不会退化成
      # "fe_sendauth: no password supplied" 的整模块 ERROR（只跳过，不假绿）。
      HERO_PG_DSN: postgresql://postgres:postgres@localhost:5432/hero_quant
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install locked dependencies (hash-checked, blocking)
        run: |
          # requirements-lock.txt 仅覆盖 core（uv pip compile pyproject.toml --generate-hashes）；阻塞式校验，无静默回退（移除 || fallback）
          pip install --require-hashes -r requirements-lock.txt
      - name: Install project and CI tools (explicit, no fallback)
        # pytest-cov/pip-audit/ruff 不在 lock 中；hash 通过后显式安装本地包与工具（不使用 || true / continue-on-error）
        run: |
          pip install -e ".[dev,ashare,us]"
          pip install pytest pytest-cov ruff pip-audit
      - name: Lint with ruff
        run: ruff check src
      - name: Frontend typecheck + build + unit tests (blocking)
        # 中文：先构建 frontend/dist，供 pytest 中 SPA 静态资源用例（test_frontend_spa）使用
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          npm run test:run --prefix frontend
      - name: Run tests
        # Coverage gate: Wave5 收口 50% (48.99% -> 50)；低频 retrieval_eval 标记为 retrieval 仅周跑，不计入此门
        # -rs 落盘 skip 原因，供下一步断言 PG 守卫没有静默跳过
        run: |
          set -o pipefail
          pytest -q --cov=src --cov-report=term --cov-fail-under=50 -rs | tee /tmp/pytest-rs.log
      - name: Assert PostgreSQL guards did not skip
        # 中文：CI 已提供 postgres service，PG 守卫用例必须真跑；出现 "PG guard" skip 直接红。
        # HERO_RLS_TEST_DSN（非 superuser 角色）不在 CI 提供，3 条 RLS 用例按设计 skip。
        run: |
          if grep -q "PG guard" /tmp/pytest-rs.log; then
            echo "PG guard skips found — CI PostgreSQL not wired to tests"
            grep "PG guard" /tmp/pytest-rs.log
            exit 1
          fi
          echo "no PG guard skips"
      - name: Pin setuptools for audit (PYSEC-2026-3447)
        # CI python3.11 镜像预装 setuptools 79.0.1（pip-audit 误报源）；lock 约束 setuptools>=83.0.0，此处先升级再审计
        run: pip install -U "setuptools>=83.0.0"
      - name: Audit dependencies
        # Blocking gate since W1-D (was "|| true")
        run: pip-audit
      - name: Generate SBOM (CycloneDX)
        # 中文：纯标准库脚本，从已安装发行版枚举组件；SBOM 是物料清单，不是漏洞门（门在上一 step 的 pip-audit）
        run: python scripts/generate_sbom.py --output sbom.json
      - name: Upload SBOM artifact
        # 中文：保留策略由 GitHub 决定（默认 90 天），SBOM 不进 git，随 workflow run 走
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error
      - name: Secret scan (gitleaks)
        # Blocking gate since W1-D: official action replaces custom `gitleaks detect --no-git || true`
        uses: gitleaks/gitleaks-action@v2 # pin: sha256:2a65dd62a8f8b5afedd072f3e2aa1c8a3b6c7a0e7d0a9c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright (root devDeps, blocking)
        # 中文：e2e 不再是可选门。根 package.json 才有 @playwright/test，先 npm ci 再跑。
        # 显式安装自带 chromium（与 @playwright/test 版本对齐），CI 内允许联网。
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright --version
      - name: Start backend for e2e (same job)
        # 中文：e2e 真阻断的前提是同 job 有后端；playwright webServer 只起 vite dev，/v1 代理到 8899。
        # HERO_ENV=development：CI 无真实 Redis 时票据/限流按开发口径放行（否则 429），生产语义不受影响。
        run: |
          HERO_ENV=development python -m uvicorn hero_quant.api.server:app --port 8899 > /tmp/hero-quant-backend.log 2>&1 &
          echo $! > /tmp/hero-quant-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8899/live > /dev/null; then
              echo "backend live after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to become live; last log:"
          tail -50 /tmp/hero-quant-backend.log
          exit 1
      - name: Run Playwright e2e (blocking)
        # 中文：真阻断（移除 continue-on-error 与 || true），失败即 job 红。
        run: npx playwright test
