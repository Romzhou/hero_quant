name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked dependencies (hash-checked)
        run: |
          # requirements-lock.txt 当前为占位 hash（单机已可跑），CI 先兼容：hash 校验失败则回退到常规安装
          pip install --require-hashes -r requirements-lock.txt || pip install -e ".[dev,ashare,us]"
      - name: Install CI tools
        run: pip install pytest ruff pip-audit
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit || true
      - name: Secret scan
        run: gitleaks detect --no-git || true
