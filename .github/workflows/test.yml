name: test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hero_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERO_CHECKPOINT_DSN: postgresql://postgres:postgres@localhost:5432/hero_quant
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install locked dependencies (hash-checked, blocking)
        run: |
          # requirements-lock.txt 仅覆盖 core（uv pip compile pyproject.toml --generate-hashes）；阻塞式校验，无静默回退（移除 || fallback）
          pip install --require-hashes -r requirements-lock.txt
      - name: Install project and CI tools (explicit, no fallback)
        # pytest-cov/pip-audit/ruff 不在 lock 中；hash 通过后显式安装本地包与工具（不使用 || true / continue-on-error）
        run: |
          pip install -e ".[dev,ashare,us]"
          pip install pytest pytest-cov ruff pip-audit
      - name: Lint with ruff
        run: ruff check src
      - name: Frontend typecheck + build + unit tests (blocking)
        # 中文：先构建 frontend/dist，供 pytest 中 SPA 静态资源用例（test_frontend_spa）使用
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          npm run test:run --prefix frontend
      - name: Run tests
        # Coverage gate: Wave5 收口 50% (48.99% -> 50)；低频 retrieval_eval 标记为 retrieval 仅周跑，不计入此门
        run: pytest -q --cov=src --cov-report=term --cov-fail-under=50
      - name: Pin setuptools for audit (PYSEC-2026-3447)
        # CI python3.11 镜像预装 setuptools 79.0.1（pip-audit 误报源）；lock 约束 setuptools>=83.0.0，此处先升级再审计
        run: pip install -U "setuptools>=83.0.0"
      - name: Audit dependencies
        # Blocking gate since W1-D (was "|| true")
        run: pip-audit
      - name: Secret scan (gitleaks)
        # Blocking gate since W1-D: official action replaces custom `gitleaks detect --no-git || true`
        uses: gitleaks/gitleaks-action@v2 # pin: sha256:2a65dd62a8f8b5afedd072f3e2aa1c8a3b6c7a0e7d0a9c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright (root devDeps, blocking)
        # 中文：e2e 不再是可选门。根 package.json 才有 @playwright/test，先 npm ci 再跑。
        run: |
          npm ci
          npx playwright --version
      - name: Start backend for e2e (same job)
        # 中文：e2e 真阻断的前提是同 job 有后端；playwright webServer 只起 vite dev，/v1 代理到 8899。
        run: |
          python -m uvicorn hero_quant.api.server:app --port 8899 > /tmp/hero-quant-backend.log 2>&1 &
          echo $! > /tmp/hero-quant-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8899/live > /dev/null; then
              echo "backend live after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to become live; last log:"
          tail -50 /tmp/hero-quant-backend.log
          exit 1
      - name: Run Playwright e2e (blocking)
        # 中文：真阻断（移除 continue-on-error 与 || true），失败即 job 红。
        run: npx playwright test
