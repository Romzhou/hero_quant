[project]
name = "hero-quant"
version = "0.3.0"
description = "真英雄量化 - 极简投研 Agent (borrowed from Vibe-Trading)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
keywords = ["quant", "trading", "agent", "research", "backtest"]
dependencies = [
    # 上界 = 已验证最高版本 +1（锁文件 0.141.1，本地实测 0.133.1）。
    # 上界不可写成 <1：fastapi 1.x 属破坏性跨越，且 starlette 已在 1.x 演进。
    # 放行下个 minor 前必须先跑 tests/test_0904_c4.py 的注入探测用例——
    # PEP604 注解（BackgroundTasks | None）会让 FastAPI 认不出该参数，
    # 模块 import 即崩，且此问题与 fastapi 版本无关（lenient_issubclass 对 union 恒 False）。
    "fastapi>=0.104,<0.142",
    "uvicorn[standard]>=0.24,<1",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "httpx>=0.28,<1",
    "rich>=13.0,<15",
    "pyyaml>=6.0,<7",
    "langchain>=1.3,<2",
    "langchain-openai>=1.0,<2",
    "prometheus_client>=0.20,<1",
    "structlog>=24.0,<27",
    "redis>=5.0,<7",
    "slowapi>=0.1.9,<1",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "setuptools>=83.0.0",
    # W1 OIDC：RS256 验签必需；缺失时 auth 层 fail-closed（AuthConfigError -> 503）。
    "cryptography>=41.0,<51",
    # PR-122 PIT 数据层：Parquet 落盘（pyarrow）+ as-of 查询（duckdb）。
    # 区间规则见 AGENTS.md §10：下界=本机实测值（没测过的版本不写下界）；
    # 存储/格式类库上界收 minor、ABI 绑定类库上界收 major。
    # duckdb 版本号非严格 semver 且自带存储格式 → 收到 <2.1；pyarrow 是 ABI 绑定库 → <27。
    # 放宽上界前必须先跑 tests/test_pr122_pit_store.py 的 as-of 反证用例。
    "duckdb>=2.0,<2.1",
    "pyarrow>=26,<27",
]

[project.optional-dependencies]
ashare = ["tushare>=1.2.89", "akshare>=1.12.0"]
us = ["yfinance>=0.2.30"]
crypto = ["ccxt>=4.5.71"]
vector = ["polars>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.9", "black>=24.0", "fakeredis>=2.0", "cryptography>=41.0", "polars>=1.0"]

[project.urls]
Repository = "https://github.com/your-org/hero-quant"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.coverage.report]
# Wave5 收口: --cov-fail-under 50 (was 48 -> 50)，CI 见 .github/workflows/test.yml
fail_under = 50
