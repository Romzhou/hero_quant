# ============================================================================
# SLI / 错误预算记录规则（PR-144）
#
# 重要前提：**保留期必须够长**。下面用 30d 窗口；生产 compose 与 prod 模板的
# `HERO_PROM_RETENTION` 默认已是 35d（docker-compose.prod.yml:190、prod.env.example:36），
# 但 staging/dev 模板是 3d/1d（staging.env.example:30、dev.env.example:30）——按这些值
# 起 Prometheus 时本文件的 30d 规则只会产出空/偏小值。要真算月度 SLO：>=35d 且磁盘够
# （TSDB 会变胖），preflight.sh:107-125 会在 <30d 时打 WARN。
#
# 目标值是**提案**（99% 可用性 / p95 < 5s），批复前不要拿它对外承诺，
# 见 docs/slo.md。
# ============================================================================
groups:
  - name: hero-quant-slo
    interval: 1m
    rules:
      # --- 可用性 SLI：1 - 错误率（错误率口径与 HeroQuantApiErrorRateHigh 一致）---
      # 口径警告（2026-10-31 复核 src 后补）：分子 hero_quant_api_errors_total 不只统计
      # 请求失败——server.py 同一计数器还用于 /ready 探针（endpoint="ready"）、后台事件
      # （"checkpoint"/"warmup"/"otel"）以及"已降级但成功"的响应
      # （error_code="degraded_response"，server.py:2193、server.py:2622）。
      # 因此本 SLI 是**偏悲观的下界**，不等于纯请求错误率；要严格口径需在 src 另拆一个
      # 只记请求失败的计数器（不在 W5 监控轮范围，见 docs/slo.md §2「口径偏差」）。
      - record: heroquant:sli_availability:ratio5m
        expr: 1 - (sum(rate(hero_quant_api_errors_total[5m])) / clamp_min(sum(rate(hero_quant_requests_total[5m])), 0.01))

      # --- 延迟 SLI：各端点 p95（秒）---
      - record: heroquant:sli_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (endpoint, le) (rate(http_request_duration_seconds_bucket[5m])))

      # --- 30 天窗口的请求/错误总量（错误预算的分母分子）---
      - record: heroquant:requests:increase30d
        expr: sum(increase(hero_quant_requests_total[30d]))

      - record: heroquant:errors:increase30d
        expr: sum(increase(hero_quant_api_errors_total[30d]))

      - record: heroquant:error_rate:ratio30d
        expr: heroquant:errors:increase30d / clamp_min(heroquant:requests:increase30d, 1)

      # 错误预算消耗比例：SLO 99% ⇒ 允许 1% 错误率；>1 表示预算耗尽。
      - record: heroquant:error_budget_consumed:ratio30d
        expr: heroquant:error_rate:ratio30d / 0.01

      # 剩余预算（1 = 全额没动，0 = 已耗尽）
      - record: heroquant:error_budget_remaining:ratio30d
        expr: clamp_min(1 - heroquant:error_budget_consumed:ratio30d, 0)

  - name: hero-quant-slo-alerts
    rules:
      # 预算耗尽就冻结发布：这是 PR-313 的"错误预算触发发布冻结"的告警形态。
      # 阈值先按"剩余为 0"触发，避免刚上线噪声太大；产品确认口径后再收紧。
      - alert: HeroQuantErrorBudgetExhausted
        expr: heroquant:error_budget_remaining:ratio30d <= 0
        for: 30m
        labels:
          severity: critical
          service: hero-quant
        annotations:
          summary: "30 天错误预算已耗尽（错误率 ≥ 1%）"
          description: "按错误预算策略应冻结非修复类发布。窗口口径见 docs/slo.md；若 Prometheus 保留期 <30d，本规则不可信（会给出空/偏小的值）——先看保留期再决策。"
          runbook: "docs/slo.md"
